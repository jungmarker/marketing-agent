<title>Reel Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a phone app. Slim slate header, one scrolling column, fixed tab bar. Shoot mode takes the whole screen. */
:root {
  --bg: #0b0a0a; --surface: #151313; --raised: #1f1c1c; --line: #2e2929;
  --fg: #f5f1ee; --muted: #a1978f; --accent: #d4163c; --accent-ink: #ffffff;
  --gold: #e8b800; --ok: #46c488; --warn: #f2a33a; --bad: #ff5d70;
  --stage: #000000; --stage-ink: #ffffff; --card-bg: #0a0a0a; --scrim: rgba(0, 0, 0, .62);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f1ee; --surface: #ffffff; --raised: #efeae6; --line: #ddd5cf;
  --fg: #161212; --muted: #6a605b; --accent: #c8102e; --accent-ink: #ffffff;
  --gold: #8a6a00; --ok: #17794c; --warn: #9a5a00; --bad: #c21f3a;
  --stage: #000000; --stage-ink: #ffffff; --card-bg: #0a0a0a; --scrim: rgba(20, 14, 12, .5); color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f4f1ee; --surface: #ffffff; --raised: #efeae6; --line: #ddd5cf;
  --fg: #161212; --muted: #6a605b; --accent: #c8102e; --accent-ink: #ffffff;
  --gold: #8a6a00; --ok: #17794c; --warn: #9a5a00; --bad: #c21f3a;
  --stage: #000000; --stage-ink: #ffffff; --card-bg: #0a0a0a; --scrim: rgba(20, 14, 12, .5); color-scheme: light }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg) }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; -webkit-tap-highlight-color: transparent }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
h1, h2, h3, p { margin: 0 }
.mono { font: 500 12.5px/1.3 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .01em }
.mono.big { font-size: 26px } .dim { color: var(--muted) } small { font-size: 12.5px; color: var(--muted) }
.grow { flex: 1 1 auto; min-width: 0 }

/* shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line) }
.stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--fg) 0 10px, var(--bg) 10px 20px); opacity: .9 }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); max-width: 680px; margin: 0 auto }
.brand { display: flex; align-items: baseline; gap: 10px } .brand b { font: 700 22px/1 var(--display); letter-spacing: .08em }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)) }
.tabbar { position: fixed; inset: auto 0 0; z-index: 15; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.tabbar a { flex: 1; text-align: center; padding: 14px 4px 13px; text-decoration: none; color: var(--muted); font: 700 16px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; border-top: 3px solid transparent; margin-top: -1px }
.tabbar a[aria-current="page"] { color: var(--fg); border-top-color: var(--accent) }
.stack { display: flex; flex-direction: column; gap: 14px } .stack.tight { gap: 10px }
.row { display: flex; align-items: center; gap: 8px; min-width: 0 } .row.wrap { flex-wrap: wrap } .row > input { flex: 1; min-width: 0 }

/* building blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.panel.flush { padding: 0; overflow: hidden } .pad { padding: 0 16px 16px; font-size: 14px }
.panel h2, h2.sec, .sheet-head h2 { font: 700 15px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.panel-head { display: flex; gap: 12px; align-items: flex-start } .panel-head h2 { color: var(--fg); font-size: 19px; letter-spacing: .05em } .panel-head p { font-size: 14px }
.stop-n { font: 700 20px/32px var(--display); width: 32px; height: 32px; flex: none; text-align: center; background: var(--fg); color: var(--bg); border-radius: 4px }
details.panel summary, details summary { cursor: pointer; font-weight: 600 } ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px }
.btn { border: 1px solid var(--line); background: var(--raised); color: var(--fg); border-radius: 8px; padding: 0 16px; min-height: 46px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; position: relative }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: transparent; color: var(--muted) } .btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px } .btn.xl { min-height: 58px; font: 700 21px/1 var(--display); letter-spacing: .06em; text-transform: uppercase }
.btn[disabled] { opacity: .45; cursor: default } label.btn input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; font-size: 0 }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--line); background: var(--raised); flex: none }
.empty { text-align: center; color: var(--muted); padding: 44px 16px; border: 1px dashed var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; align-items: center } .empty.sm { padding: 20px 14px; font-size: 15px } .empty b { color: var(--fg); font: 700 22px var(--display); letter-spacing: .04em }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; flex: none } @keyframes spin { to { transform: rotate(360deg) } }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px }
.slate-chip { font: 500 11.5px/1 var(--mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); align-self: flex-start }
.tag-on { font: 500 11px/1 var(--mono); color: var(--ok); text-transform: uppercase; letter-spacing: .06em }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; border: 2px solid var(--line) } .dot-sent { background: var(--gold); border-color: var(--gold) } .dot-good { background: var(--ok); border-color: var(--ok) } .dot-retake { background: var(--warn); border-color: var(--warn) }
.state { display: inline-flex; gap: 6px; align-items: center; font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) } .state-good { color: var(--ok) } .state-retake { color: var(--warn) } .state-sent { color: var(--gold) }
.fix { font-size: 14px; padding-left: 10px; border-left: 3px solid var(--line) } .fix-warn { border-color: var(--warn) } .fix-bad { border-color: var(--bad); color: var(--bad) }
.card { display: inline-block; background: var(--card-bg); color: var(--stage-ink); font: 700 15px/1.2 var(--body); padding: 6px 10px; letter-spacing: .02em; align-self: flex-start } .card-hook { background: var(--accent); color: var(--accent-ink) } .card, .ov-card { white-space: pre-line } .card-lg { font-size: 24px; padding: 10px 14px } .sm-card { font-size: 11px; padding: 3px 6px }
.field { display: flex; flex-direction: column; gap: 6px } .field > span { font: 700 13px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
input[type="text"], input[type="number"], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; width: 100%; font-size: 16px } textarea { min-height: 96px; resize: vertical }
.switch { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted) } .switch input, .check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none }
.check { display: flex; gap: 12px; align-items: flex-start } .check small { display: block } .check input { margin-top: 2px }
.meter { display: flex; align-items: center; gap: 12px } .meter-bar { flex: 1; height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden } .meter-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s }
.notice, .banner { text-align: left; background: var(--raised); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 8px; padding: 12px 14px; font-size: 15px; width: 100% } .banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap }

/* today */
.hero { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 6px }
.hero h1 { font: 700 38px/1.02 var(--display); letter-spacing: .005em; text-transform: uppercase; text-wrap: balance }
.hero-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap } .why { color: var(--muted); font-size: 15px; max-width: 60ch }
.stepper { list-style: none; display: flex; gap: 4px; padding: 0; margin: 0 } .stepper li { flex: 1; font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 8px; border-top: 3px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stepper li.done { border-color: var(--fg) } .stepper li.on { border-color: var(--accent); color: var(--fg) }
.shot-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); padding: 12px 0; min-width: 0 } .shot-row.row-on { color: var(--gold) }
.id { background: var(--raised); padding: 4px 6px; border-radius: 4px; flex: none } .shot-text { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .shot-text i { color: var(--gold); font-style: normal }
.alt-hook { font-size: 15px; margin-top: 8px }

/* shoot mode */
.shoot { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px) }
.shoot-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line) }
.shoot-where { display: flex; flex-direction: column; flex: 1; min-width: 0 } .shoot-where b { font: 700 22px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase }
.pips { display: flex; gap: 4px; flex-basis: 100% } .pip { flex: 1; height: 8px; border-radius: 2px; border: 0; padding: 0; background: var(--raised) } .pip-sent { background: var(--gold) } .pip-good { background: var(--ok) } .pip-retake { background: var(--warn) } .pip-on { outline: 2px solid var(--fg); outline-offset: 1px }
.shoot-scroll { flex: 1; overflow-y: auto; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch }
.stop-tip { background: var(--raised); border-left: 4px solid var(--gold); padding: 10px 12px; border-radius: 6px; font-size: 15px }
.shoot-main { display: flex; gap: 14px; align-items: flex-start } .guide { width: 38%; max-width: 170px; flex: none; height: auto }
dl.dir { display: grid; grid-template-columns: 1fr; gap: 2px; margin: 0; min-width: 0; font-size: 15px } dl.dir dt { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 8px } dl.dir dt:first-child { margin-top: 0 } dl.dir dd { margin: 0 }
.g-frame { fill: var(--stage); stroke: var(--line); stroke-width: 1.5 } .g-third { stroke: var(--stage-ink); stroke-width: .25; opacity: .22 } .g-head, .g-body { fill: var(--stage-ink); opacity: .82 } .g-subject { fill: none; stroke: var(--stage-ink); stroke-width: .8; stroke-dasharray: 3 2; opacity: .8 } .g-cross { stroke: var(--stage-ink); stroke-width: .8; opacity: .8 }
.g-safe { fill: none; stroke: var(--ok); stroke-width: .7; stroke-dasharray: 2.5 2 } .g-card { fill: var(--card-bg); stroke: var(--stage-ink); stroke-width: .4 } .g-hook { fill: var(--accent); stroke: none } .g-label { fill: var(--stage-ink); font: 700 5px var(--body); letter-spacing: .12em } .g-cap { fill: var(--stage-ink); opacity: .5 } .g-ui { fill: var(--stage-ink); opacity: .25 } .g-move { fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round } .g-note { fill: var(--gold); font: 700 5px var(--body); letter-spacing: .08em }
.prompter { display: flex; flex-direction: column; gap: 10px } .prompter > small { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase }
.line { font: 600 34px/1.08 var(--display); letter-spacing: .005em; text-wrap: balance } .cut-desc { font: 600 24px/1.15 var(--display) } .do { color: var(--muted); font-size: 15px }
.rehearse { flex: 1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 46px } .rehearse-label { flex-basis: 100%; font-size: 13px; color: var(--muted) } .rehearse-ok .big { color: var(--ok) } .rehearse-over .big, .rehearse-under .big { color: var(--warn) }
.rec-row { display: flex; gap: 8px } .btn.rec { flex: 1; min-height: 58px; background: var(--fg); color: var(--bg); border-color: var(--fg); font: 700 20px/1 var(--display); letter-spacing: .06em; text-transform: uppercase } .rec-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent) }
.recording { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 16px; border: 1px dashed var(--gold); border-radius: 8px; color: var(--gold); font-weight: 600 }
.take { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px } .take-picked { border-color: var(--ok) }
.take video, .trim-video, .final { width: 100%; max-height: 46vh; background: var(--stage); border-radius: 6px } .take-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap } .take-meta .btn:first-of-type, .take-meta .tag-on { margin-left: auto }
.checks { display: flex; flex-direction: column; gap: 8px } .chips { display: flex; gap: 6px; flex-wrap: wrap } .chip { font: 500 11.5px/1 var(--mono); padding: 6px 8px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line) } .chip-ok { color: var(--ok) } .chip-warn { color: var(--warn); border-color: var(--warn) } .chip-bad { color: var(--bad); border-color: var(--bad) }
.verdict { border-left: 4px solid var(--ok); padding: 2px 0 2px 12px; font-size: 15px; display: flex; flex-direction: column; gap: 4px } .verdict-retake { border-color: var(--warn) } .verdict b { font: 700 15px var(--display); letter-spacing: .1em; text-transform: uppercase } .verdict ul { margin: 0; padding-left: 18px }
.shoot-nav { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface) }

/* cut */
.player { display: flex; flex-direction: column } .stage { position: relative; width: 100%; max-width: 300px; margin: 14px auto 0; aspect-ratio: 9 / 16; background: var(--stage); border-radius: 12px; overflow: hidden; container-type: inline-size; color: var(--stage-ink) }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0 }
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 34% 26% 34% 8%; background: repeating-linear-gradient(-45deg, #141212 0 12px, #0b0a0a 12px 24px) } .slide p { font: 600 20px/1.15 var(--display) } .slide small, .slide .mono { color: #a1978f }
.ov-card { position: absolute; top: 14%; left: 5.5%; max-width: 71%; background: var(--card-bg); color: var(--stage-ink); font: 700 19px/1.15 var(--body); font-size: 6.4cqw; padding: .25em .5em; text-align: center } .ov-card.card-hook { background: var(--accent); font-size: 7.6cqw }
.ov-cap { position: absolute; left: 7%; right: 24%; bottom: 27%; text-align: center; font: 700 17px/1.2 var(--body); font-size: 5.6cqw; text-shadow: 0 0 6px #000, 0 2px 3px #000, 0 0 2px #000 }
.ov-ui { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#000a 0 0) top / 100% 12% no-repeat, linear-gradient(#000a 0 0) bottom / 100% 25% no-repeat, linear-gradient(#0007 0 0) right 0 top 12% / 21.3% 63% no-repeat } .ov-ui i { position: absolute; right: 5.5%; width: 9%; aspect-ratio: 1; border-radius: 50%; background: #fff6 } .ov-ui i:nth-child(1) { bottom: 47% } .ov-ui i:nth-child(2) { bottom: 39% } .ov-ui i:nth-child(3) { bottom: 31% } .ov-ui i:nth-child(4) { bottom: 23% } .ov-ui b { position: absolute; left: 5%; height: 1.6%; border-radius: 4px; background: #fff6 } .ov-ui b:nth-of-type(1) { bottom: 14%; width: 46% } .ov-ui b:nth-of-type(2) { bottom: 9%; width: 68% }
.play { position: absolute; inset: 0; width: 100%; background: transparent; border: 0; color: #fff; font-size: 44px; text-shadow: 0 2px 12px #000 } .play.is-playing { opacity: 0 }
.transport { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px 0; flex-wrap: wrap }
.timeline { display: flex; gap: 3px; padding: 12px 16px 14px } .tl { position: relative; height: 38px; min-width: 0; border-radius: 4px; border: 0; padding: 0; background: var(--raised); color: var(--muted); font: 500 11px var(--mono); overflow: hidden } .tl span { position: relative } .tl i { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .55 }
.tl-sent { background: color-mix(in srgb, var(--gold) 34%, var(--raised)); color: var(--fg) } .tl-good { background: color-mix(in srgb, var(--ok) 38%, var(--raised)); color: var(--fg) } .tl-retake { background: color-mix(in srgb, var(--warn) 40%, var(--raised)); color: var(--fg) } .tl-on { outline: 2px solid var(--fg); outline-offset: 1px } .tl-long::after { content: ""; position: absolute; inset: auto 0 0; height: 3px; background: var(--bad) }
.cut-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0 16px 12px; font-size: 14px; color: var(--muted) } .cut-facts b { color: var(--fg) } .cut-facts .bad, .cut-facts .bad b { color: var(--bad) }
.ed-line { font: 600 21px/1.15 var(--display) } .trim { display: flex; flex-direction: column; gap: 10px }
.wave { position: relative; height: 54px; background: var(--raised); border-radius: 6px; overflow: hidden } .wave-bars { position: absolute; inset: 6px; display: flex; align-items: center; gap: 1px } .wave-bars i { flex: 1; background: var(--fg); border-radius: 1px; min-height: 2px } .wave-cut { position: absolute; top: 0; bottom: 0; background: var(--scrim) }
.range { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted) } .range b { color: var(--fg) } input[type="range"] { width: 100%; accent-color: var(--accent); height: 30px }
.take-strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center } .take-pill { border: 1px solid var(--line); background: var(--raised); border-radius: 20px; padding: 7px 12px; font: 500 12px var(--mono) } .take-pill.on { border-color: var(--fg); background: var(--fg); color: var(--bg) } .take-pill.v-retake:not(.on) { border-color: var(--warn) } .take-pill.v-keep:not(.on) { border-color: var(--ok) }
.cutaway { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px } .cutaway > small { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold) }
.notes { display: flex; flex-direction: column; gap: 8px } .msg { font-size: 15px; padding: 10px 12px; border-radius: 10px; background: var(--raised); overflow-wrap: anywhere; white-space: pre-wrap } .msg small { display: block; margin-bottom: 2px } .msg-claude { border-left: 3px solid var(--gold) } .msg-nick { margin-left: 28px }
pre.caption { white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.5 var(--body); margin: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; -webkit-user-select: all; user-select: all }

/* ideas and board */
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px } .idea-top { display: flex; justify-content: space-between; align-items: center } .idea h3 { font: 600 23px/1.1 var(--display); text-wrap: balance } .idea-hook { font-size: 16px } .idea .dim { font-size: 14px }
.bars { display: flex; flex-direction: column; gap: 9px } .bar-row { display: grid; grid-template-columns: minmax(0, 40%) 1fr 46px; gap: 10px; align-items: center; font-size: 14px } .bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .bar-row .mono { text-align: right }
.bar-track { position: relative; height: 16px; background: var(--raised); border-radius: 3px } .bar-track i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--muted) } .bar-track i.up { background: var(--ok) } .bar-track em, .bar-key em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg) } .bar-key { position: relative; padding-left: 12px; font-size: 13px; color: var(--muted) } .bar-key em { left: 2px; top: 2px; bottom: 2px }
.pattern { border-top: 1px solid var(--line); padding-top: 10px } .pattern b { font: 600 19px/1.15 var(--display) } .pattern p { font-size: 15px; color: var(--muted) }
.outliers { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 10px } .outliers li { display: flex; gap: 12px; font-size: 15px } .outliers b { color: var(--gold); min-width: 52px; text-align: right; padding-top: 2px } .outliers small { display: block }
.reel-row { border-top: 1px solid var(--line) } .reel-main { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; width: 100%; background: transparent; border: 0; padding: 12px 0 } .reel-main b { font: 600 21px/1.1 var(--display) } .reel-open { padding: 0 0 14px; display: flex; flex-direction: column; gap: 10px }
.stage-chip { font: 500 11px/1 var(--mono); padding: 5px 8px; border-radius: 4px; background: var(--raised); text-transform: uppercase; letter-spacing: .05em } .st-approved, .st-posted { color: var(--ok) } .st-shooting, .st-ready_to_edit, .st-review { color: var(--gold) }
.num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px } .num span { font: 700 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) } .results { display: flex; flex-direction: column; gap: 10px; align-items: flex-start } .results .num-grid { width: 100% }

/* no-talking videos */
.setup-box { background: var(--raised); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px }
ol.cues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column } ol.cues li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line) }
.cue-t { color: var(--gold); min-width: 40px; padding-top: 6px } .cue-body { display: flex; flex-direction: column; gap: 6px; min-width: 0 } .cue-body p { font-size: 17px; font-weight: 500 } .cues.compact .cue-body p { font-size: 15px; font-weight: 400 } .cues.compact li { padding: 8px 0 }
.bank-lines { font-size: 15px; display: flex; flex-direction: column; gap: 6px } ol.bank-lines { padding-left: 20px; gap: 8px }
.slate-head { margin-top: 10px; padding-top: 14px; border-top: 2px solid var(--line) }
.ov-cue { position: absolute; background: var(--card-bg); color: var(--stage-ink); font: 700 15px/1.15 var(--body); font-size: 5cqw; padding: .3em .5em; max-width: 44%; white-space: pre-line } .ov-cue.card-hook { background: var(--accent); max-width: 74% }
.pos-top { top: 13%; left: 39.8%; transform: translateX(-50%); max-width: 74%; text-align: center } .pos-mid { top: 32%; left: 39.8%; transform: translateX(-50%); max-width: 74%; text-align: center } .pos-low { top: 46%; left: 39.8%; transform: translateX(-50%); max-width: 74%; text-align: center }
.pos-top-left { top: 15%; left: 5% } .pos-mid-left { top: 32%; left: 5% } .pos-low-left { top: 46%; left: 5% }
.pos-top-right { top: 15%; right: 23%; text-align: right } .pos-mid-right { top: 32%; right: 23%; text-align: right } .pos-low-right { top: 46%; right: 23%; text-align: right }
.pos-r1, .pos-r2, .pos-r3, .pos-r4 { left: 39.8%; transform: translateX(-50%); max-width: 74%; text-align: center } .pos-r1 { top: 14% } .pos-r2 { top: 23% } .pos-r3 { top: 32% } .pos-r4 { top: 41% }
.practice { position: fixed; inset: 0; z-index: 45; background: var(--bg); display: flex; flex-direction: column; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.practice-top { display: flex; justify-content: space-between; align-items: center } .practice-stage { margin: 0 auto; max-width: min(300px, 52vh) }
.practice-do { font: 600 26px/1.15 var(--display); text-align: center; text-wrap: balance } .practice-next { text-align: center; font-size: 15px }
.count { position: absolute; inset: 0; display: grid; place-items: center; font: 700 90px var(--display); color: var(--stage-ink) }

.boot-err { background: var(--bad); color: var(--stage); padding: 12px 14px; border-radius: 8px; margin: 12px 16px; font-weight: 600; font-size: 15px }
/* sheets, chat, toasts */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 680px; max-height: 88%; background: var(--surface); border-radius: 16px 16px 0 0; border: 1px solid var(--line); border-bottom: 0; display: flex; flex-direction: column }
.sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 6px } .sheet-body { overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px }
.ai-box { border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 10px } .option { text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px; width: 100% } .option small { display: block; margin-bottom: 3px; color: var(--gold) }
.chat { display: flex; flex-direction: column; gap: 8px; min-height: 120px } .starters { display: flex; flex-direction: column; gap: 8px } .ask-row { position: sticky; bottom: 0; background: var(--surface); padding-top: 8px }
.toasts { position: fixed; z-index: 50; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 0 16px; pointer-events: none }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 500; max-width: 520px; box-shadow: 0 6px 24px #0006 } .toast-bad { background: var(--bad); color: var(--stage) } .toast-good { background: var(--ok); color: var(--stage) }
@media (min-width: 560px) { .stage { max-width: 340px } .hero h1 { font-size: 48px } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s } .meter-bar i { transition: none } }
</style>

})();
</script>

        setup: ["Rear camera, 1x lens, vertical, 1080p at 30. Each clip under 20 MB, so not 4K.", "HDR video off. Lock focus and exposure on your face.", "One clip per line. A second of silence before and after you speak.", "Keep the top fifth of the frame empty above your head for the text card.", "Clip-on or wired mic. Play one clip back before shooting the rest."] };
      return { reel: reel, beats: beats };
    });
  };

  /* 5. ask anything about the reel in front of you */
  RR.ask = function (turns, onText, signal) {
    var lead = [ "You are Nick's co-producer inside his reel production app. Answer in a few plain sentences he can act on while standing on a sidewalk with a phone. If he asks for a line, give the line.",
      voice(), RULES, reelText(), research() ].filter(Boolean).join("\n\n");
    return S.cap.sample([{ role: "user", content: lead }].concat(turns), { cache: false, modelTier: "default", onText: onText, signal: signal });
  };
})();

</script>
<script>/* ui-shoot.js */
/* Reel Room - Today tab and the on-set shoot mode. */
(function () {
  "use strict";
  var RR = window.RR, S = RR.S, html = RR.html, ui = (RR.ui = {});

  };
  ui.Dot = function (p) { return html`<span class=${"dot dot-" + p.s} aria-hidden="true"></span>`; };

  ui.State = function (p) { return html`<span class=${"state state-" + p.s}><${ui.Dot} s=${p.s} />${STATE[p.s]}</span>`; };

  /* what was measured, what Claude saw, what the editor said */
  ui.Checks = function (p) {
    var c = p.clip, job = S.jobs["review" + c._id];

      <div class="chips">${(c.checks || []).map(function (k) { return html`<span class=${"chip chip-" + k.level} title=${k.detail}>${k.label}</span>`; })}</div>
      ${(c.checks || []).filter(function (k) { return k.level !== "ok" && k.detail; }).map(function (k) { return html`<p class=${"fix fix-" + k.level}>${k.detail}</p>`; })}

    </div>`;
  };
  ui.Take = function (p) {
    var c = p.clip, picked = p.picked;
    return html`<div class=${RR.cls("take", picked && "take-picked")}>
      <video controls preload="metadata" playsinline src=${"/_blob/" + c.asset + "#t=" + (c.in || 0).toFixed(2)}></video>
      <div class="take-meta"><span class="mono">${RR.sec(RR.clipLen(c))}</span><span class="mono dim">${RR.when(c.at)}</span>
        ${picked ? html`<span class="tag-on">In the cut</span>` : p.onPick && html`<button class="btn sm" onClick=${p.onPick}>Use this take</button>`}
        ${S.cap.assets && html`<button class="btn sm ghost" onClick=${function () { RR.act.removeClip(c); }}>Delete</button>`}</div>
      <${ui.Checks} clip=${c} />
    </div>`;
  };
  ui.Record = function (p) {
    var key = p.beat._id + p.kind, job = S.jobs[key];
    if (!S.cap.assets) return html`<p class="dim">Recording is available to the page's owner, signed in.</p>`;
    if (job) return html`<div class="recording"><span class="spin"></span>${job}…</div>`;
    var pick = function (e) { var f = e.target.files && e.target.files[0]; e.target.value = ""; RR.addTake(p.beat, p.kind, f).then(function (id) { if (id && p.onDone) p.onDone(); }); };
    return html`<div class="rec-row">
      <label class="btn rec"><span class="rec-dot"></span>${p.label}<input type="file" accept="video/*" capture="environment" onChange=${pick} /></label>
      <label class="btn ghost">Library<input type="file" accept="video/*" onChange=${pick} /></label></div>`;
  };

  /* a drawing of the frame you are trying to get */
  var FRAMES = [ [/close.*shoulder|^close/i, { r: 13.5, cy: 66, w: 50, yb: 170 }], [/medium close|chest/i, { r: 10, cy: 60, w: 38, yb: 170 }],
    [/medium wide|knees/i, { r: 5.2, cy: 50, w: 18, yb: 170 }], [/wide/i, { r: 3.8, cy: 62, w: 12, yb: 122 }], [/./, { r: 7.6, cy: 56, w: 27, yb: 170 }] ];
  ui.FrameGuide = function (p) {
    var b = p.beat, cut = p.kind === "broll", f = FRAMES.filter(function (x) { return x[0].test(b.framing || ""); })[0][1];
    var cx = b.stand === "left" || /left third/i.test(b.framing || "") ? 26 : b.stand === "right" || /right third/i.test(b.framing || "") ? 58 : 40;
    var boxes = []; (b.cues || []).forEach(function (c) { if (boxes.indexOf(c.pos) < 0) boxes.push(c.pos); });
    var moves = /walk|climb|you move|out of frame/i.test((b.move || "") + (b.shot || ""));
    var low = /low/i.test(b.angle || ""), top = f.cy + f.r + 2;
    return html`<svg class="guide" viewBox="0 0 90 160" role="img" aria-label=${cut ? "Cutaway framing" : "Framing guide: " + (b.framing || "medium")}>
      <defs><clipPath id=${"clip-" + b._id + p.kind}><rect x="1" y="1" width="88" height="158" rx="6" /></clipPath></defs>
      <rect class="g-frame" x="1" y="1" width="88" height="158" rx="6" />
      <g clip-path=${"url(#clip-" + b._id + p.kind + ")"}>
        <line class="g-third" x1="30" y1="1" x2="30" y2="159" /><line class="g-third" x1="60" y1="1" x2="60" y2="159" />
        <line class="g-third" x1="1" y1="53" x2="89" y2="53" /><line class="g-third" x1="1" y1="107" x2="89" y2="107" />
        ${cut ? html`<g><rect class="g-subject" x="20" y="52" width="50" height="56" rx="3" /><line class="g-cross" x1="45" y1="72" x2="45" y2="88" /><line class="g-cross" x1="37" y1="80" x2="53" y2="80" /></g>`
          : html`<g><rect class="g-body" x=${cx - f.w / 2} y=${top} width=${f.w} height=${f.yb - top} rx=${f.w * 0.32} /><circle class="g-head" cx=${cx} cy=${f.cy} r=${f.r} /></g>`}
        ${moves && !cut && html`<path class="g-move" d=${"M " + (cx - 24) + " 138 L " + (cx + 16) + " 138 m -5 -4 l 5 4 l -5 4"} />`}

      ${b.cues ? boxes.map(function (pos) { var g = RR.GPOS[pos] || RR.GPOS.top; return html`<rect class="g-card" x=${g[0]} y=${g[1]} width=${g[2]} height="8" rx="1" />`; })
        : b.screen && html`<g><rect class=${"g-card" + (p.first ? " g-hook" : "")} x="9" y="23" width="56" height="11" rx="1" /><text class="g-label" x="37" y="30.6" text-anchor="middle">TEXT</text></g>`}
      ${b.say && html`<rect class="g-cap" x="16" y="106" width="42" height="6" rx="1" />`}
      <circle class="g-ui" cx="80" cy="96" r="3" /><circle class="g-ui" cx="80" cy="108" r="3" /><circle class="g-ui" cx="80" cy="120" r="3" />
      <rect class="g-ui" x="6" y="134" width="40" height="4" rx="2" /><rect class="g-ui" x="6" y="142" width="58" height="3" rx="1.5" />
      ${low && html`<text class="g-note" x="45" y="154" text-anchor="middle">PHONE LOW, TILT UP</text>`}
    </svg>`;
  };

  /* say it against the clock before you record it */
  ui.Rehearse = function (p) {
    var st = RR.useState(null), t0 = st[0], setT0 = st[1], el = RR.useState(0), ms = el[0], setMs = el[1];
    RR.useEffect(function () { if (t0 == null) return; var id = setInterval(function () { setMs(performance.now() - t0); }, 50); return function () { clearInterval(id); }; }, [t0]);
    RR.useEffect(function () { setT0(null); setMs(0); }, [p.id]);
    var s = ms / 1000, tgt = p.target, state = !ms ? "" : s > tgt * 1.3 ? "over" : s < tgt * 0.7 && t0 == null ? "under" : "ok";
    return html`<button class=${"rehearse rehearse-" + state} onClick=${function () { if (t0 == null) { setMs(0); setT0(performance.now()); } else setT0(null); }}>
      <span class="mono big">${s.toFixed(1)}</span><span class="mono dim">/ ${tgt.toFixed(1)}s</span>
      <span class="rehearse-label">${t0 != null ? "Tap when you finish the line" : ms ? (state === "over" ? "Long. Tighten it" : state === "under" ? "Rushed. Slow down" : "On pace") : "Rehearse against the clock"}</span></button>`;
  };

  ui.Rewrite = function (p) {
    var beat = p.beat, st = RR.useState({ loading: false, options: null, err: "" }), s = st[0], set = st[1], dr = RR.useState(beat.say || ""), draft = dr[0], setDraft = dr[1], ak = RR.useState(""), ask = ak[0], setAsk = ak[1];
    var run = function () { set({ loading: true, options: null, err: "" }); RR.rewriteLine(beat, ask).then(function (o) { set({ loading: false, options: o, err: o.length ? "" : "Nothing came back. Try again." }); }, function (e) { set({ loading: false, options: null, err: RR.aiError(e) }); }); };
    var save = function (t) { RR.act.line(beat, t).then(p.onClose); };
    return html`<${ui.Sheet} title=${"Line " + beat._id} onClose=${p.onClose}>
      <label class="field"><span>Your line</span><textarea id=${"line-" + beat._id} value=${draft} onInput=${function (e) { setDraft(e.target.value); }}></textarea></label>
      <div class="row"><span class="mono dim">about ${RR.sec(RR.sayTime(draft))} · ${RR.words(draft)} words</span><button class="btn primary" disabled=${!draft.trim() || draft.trim() === beat.say} onClick=${function () { save(draft); }}>Save line</button></div>
      ${S.cap.sample && html`<div class="ai-box">
        <label class="field"><span>Ask Claude for other ways to say it</span><input type="text" id=${"ask-" + beat._id} placeholder="shorter, funnier, in Spanish, less salesy…" value=${ask} onInput=${function (e) { setAsk(e.target.value); }} /></label>
        <button class="btn" disabled=${s.loading} onClick=${run}>${s.loading ? html`<span class="spin"></span>Writing` : "Give me three options"}</button>

        ${s.options && s.options.map(function (o) { return html`<button class="option" onClick=${function () { save(o.say); }}><small>${o.label || "Option"} · ${RR.sec(RR.sayTime(o.say))}</small>${o.say}</button>`; })}
      </div>`}
    <//>`;
  };

  /* ---------- shoot mode: one shot at a time, in the order you would shoot ---------- */
  ui.ShootMode = function () {
    var list = RR.shotList(), i = Math.min(S.shoot.i, list.length - 1), shot = list[i];
    RR.useEffect(function () { return RR.wake(); }, []);
    RR.useEffect(function () { var el = document.querySelector(".shoot-scroll"); if (el) el.scrollTop = 0; }, [i]);
    if (!shot) return null;
    var b = shot.beat, cut = shot.kind === "broll", takes = RR.takes(b._id, shot.kind).slice().reverse(), chosen = RR.chosen(b, shot.kind);
    var go = function (n) { RR.set({ shoot: { i: Math.max(0, Math.min(list.length - 1, n)) } }); };
    var nextTodo = function () { for (var k = 1; k <= list.length; k++) { var j = (i + k) % list.length; if (!RR.takes(list[j].beat._id, list[j].kind).length) return j; } return -1; };
    var nt = nextTodo(), firstBeat = S.beats[0] && S.beats[0]._id === b._id;
    var newStop = i === 0 || list[i - 1].stop !== shot.stop;
    return html`<div class="shoot">

        <button class="icon-btn" aria-label="Leave shoot mode" onClick=${function () { RR.set({ shoot: null }); }}>✕</button>

        <div class="pips">${list.map(function (s, k) { return html`<button aria-label=${"Shot " + (k + 1)} class=${RR.cls("pip", "pip-" + (RR.takes(s.beat._id, s.kind).length ? RR.beatState(s.beat) : "todo"), k === i && "pip-on")} onClick=${function () { go(k); }}></button>`; })}</div>
      </div>

          <dl class="dir">
            <dt>Clip</dt><dd class="mono">${b._id}${cut ? " cutaway" : ""}</dd>
            ${!cut && html`<dt>Framing</dt><dd>${b.framing}</dd><dt>Angle</dt><dd>${b.angle}</dd><dt>Camera</dt><dd>${b.move}</dd>`}
            <dt>Where</dt><dd>${b.location}</dd>
          </dl>
        </div>
        ${cut ? html`<div class="prompter"><small>Cutaway, no talking</small><p class="cut-desc">${b.broll}</p><small>Plays over: “${b.say}”</small></div>`
          : b.cues ? html`<${ui.CueSheet} beat=${b} setup=${RR.reel() && RR.reel().setup_detail} />`
          : !b.say ? html`<div class="prompter"><small>No talking. Text goes on screen</small>
              <span class=${RR.cls("card card-lg", firstBeat && "card-hook")}>${b.screen}</span>
              <p class="cut-desc">${b.shot}</p><small>Hold it for ${RR.sec(b.seconds || 3)}. Leave room in the frame for the text.</small></div>`
          : html`<div class="prompter">
              <small>Say</small><p class="line">${b.say}</p>
              ${b.screen && html`<span class=${RR.cls("card", firstBeat && "card-hook")}>${b.screen}</span>`}
              <p class="do">${b.shot}</p>
              <div class="row"><${ui.Rehearse} id=${b._id} target=${RR.sayTime(b.say)} /><button class="btn ghost" onClick=${function () { RR.set({ sheet: { type: "rewrite", beat: b._id } }); }}>Change line</button></div>
            </div>`}
        <${ui.Record} beat=${b} kind=${shot.kind} label=${takes.length ? "Record another take" : cut ? "Record cutaway" : b.say ? "Record this line" : b.cues ? "Record the whole take" : "Record this shot"} />
        ${takes.map(function (c) { return html`<${ui.Take} key=${c._id} clip=${c} picked=${chosen && chosen._id === c._id} onPick=${function () { var pch = {}; pch[cut ? "take_broll" : "take"] = c._id; RR.act.beat(b._id, pch); }} />`; })}
      </div>
      <div class="shoot-nav">
        <button class="btn ghost" disabled=${i === 0} onClick=${function () { go(i - 1); }}>Back</button>
        ${nt < 0 ? html`<button class="btn primary grow" onClick=${function () { RR.set({ shoot: null }); RR.go("cut"); }}>Everything is shot. Open the cut</button>`
          : html`<button class=${RR.cls("btn grow", takes.length && "primary")} onClick=${function () { go(takes.length ? nt : i + 1 < list.length ? i + 1 : nt); }}>${takes.length ? "Next to shoot: " + list[nt].beat._id + (list[nt].kind === "broll" ? " cutaway" : "") : "Skip for now"}</button>`}

    </div>`;
  };

  /* ---------- no-talking videos: the cue sheet and a practice run ---------- */
  RR.GPOS = { top: [12, 22, 50, 0], "top-left": [5, 22, 32], "top-right": [38, 22, 32], mid: [12, 50, 50], "mid-left": [5, 50, 32], "mid-right": [38, 50, 32],
    "low-left": [5, 72, 32], "low-right": [38, 72, 32], low: [12, 72, 50], r1: [10, 24, 54], r2: [10, 36, 54], r3: [10, 48, 54], r4: [10, 60, 54] };
  RR.POSNAME = { top: "top middle", "top-left": "top left", "top-right": "top right", mid: "middle", "mid-left": "middle left", "mid-right": "middle right",
    "low-left": "lower left", "low-right": "lower right", low: "lower middle", r1: "line 1", r2: "line 2", r3: "line 3", r4: "line 4" };
  ui.CueSheet = function (p) {
    var b = p.beat, r = RR.reel() || {}, st = r.setup_detail || {};

      <small>No talking. One continuous take, about ${Math.round(b.seconds)} seconds</small>

      </div>
      <ol class="cues">${b.cues.map(function (c, i) { return html`<li>
        <span class="mono cue-t">${c.at.toFixed(1)}s</span>
        <div class="cue-body"><span class=${RR.cls("card", i === 0 && "card-hook")}>${c.text}</span>
          <small>Text appears ${RR.POSNAME[c.pos] || c.pos}${c.keep ? " and stays" : ""}</small>
          <p>${c.do}</p></div></li>`; })}</ol>
      <button class="btn xl" onClick=${function () { RR.set({ practice: b._id }); }}>Practice run with a timer</button>
    </div>`;
  };
  ui.Practice = function () {

    RR.useEffect(function () { var t0 = performance.now() + 3000, id = setInterval(function () { setT((performance.now() - t0) / 1000); }, 100); var rel = RR.wake(); return function () { clearInterval(id); rel(); }; }, []);
    if (!b || !b.cues) return null;
