      <p class="practice-do">${t < 0 ? b.cues[0].do : t >= total ? "That's the take. Tap to close, then record it for real." : now ? now.do : ""}</p>
      ${next && t >= 0 && html`<p class="dim practice-next">Next: ${next.do}</p>`}
      <div class="meter"><div class="meter-bar"><i style=${"width:" + Math.max(0, Math.min(100, 100 * t / total)) + "%"}></i></div></div>
    </div>`;
  };

  /* ---------- Today ---------- */
  ui.Stepper = function (p) {
    var at = Math.max(0, RR.STAGES.indexOf(p.status === "changes" ? "ready_to_edit" : p.status));
    var steps = ["Script", "Shoot", "Cut", "Review", "Approved", "Posted"];
    return html`<ol class="stepper">${steps.map(function (s, k) { return html`<li class=${k < at ? "done" : k === at ? "on" : ""}>${s}</li>`; })}</ol>`;
  };
  ui.Today = function () {
    var r = RR.reel();
    if (!S.booted) return html`<div class="stack"><${ui.Bank} top=${true} /><div class="empty sm"><span class="spin"></span>Connecting to your saved reels…</div></div>`;
    if (S.failed && !r) return html`<div class="stack"><${ui.Bank} top=${true} /><div class="empty sm">${S.failed === "signed_out" ? "Your saved reels and recording need you signed in to Claude. The list above still works for reading." : "Your saved reels did not load (" + S.failed + "). The list above still works for reading. Reopen the page to try again."}</div></div>`;
    if (!r) return html`<div class="stack"><${ui.Bank} top=${true} /></div>`;
    var list = RR.shotList(), prog = RR.progress(), open = (r.verify || []).filter(function (v) { return !v.done; }).length;
    var firstTodo = -1; list.some(function (s, k) { if (!RR.takes(s.beat._id, s.kind).length) { firstTodo = k; return true; } });
    var retakes = list.filter(function (s) { return s.kind === "aroll" && RR.beatState(s.beat) === "retake"; });
    var stops = []; list.forEach(function (s, k) { var last = stops[stops.length - 1]; if (!last || last.name !== s.stop) stops.push(last = { name: s.stop, tip: s.tip, shots: [] }); last.shots.push({ s: s, k: k }); });
    var start = function (k) { if (r.status === "scripted") RR.act.status("shooting"); RR.set({ shoot: { i: k } }); };
    return html`<div class="stack">
      <${ui.Bank} top=${true} />
      <h2 class="sec slate-head">On the slate now</h2>
      ${S.viewId !== S.currentId && html`<div class="banner">You are looking at a reel that is not on today's slate.<button class="btn sm" onClick=${function () { RR.act.makeCurrent(S.viewId); }}>Make it today's reel</button></div>`}
      <section class="hero">
        <${ui.Stepper} status=${r.status} />
        <h1>${r.title}</h1>
        <div class="hero-meta"><span class="slate-chip">${r.formula || "Reel"}</span><span class="mono dim">${S.beats.length} ${r.kind && r.kind !== "talk" ? "shots" : "lines"} · about ${Math.round(RR.total())}s · ${stops.length} spots</span></div>
        ${r.why && html`<p class="why">${r.why}</p>`}
        <div class="meter"><div class="meter-bar"><i style=${"width:" + prog.pct + "%"}></i></div><span class="mono">${prog.done}/${prog.of} shot</span></div>
        ${!S.loadedView ? null : firstTodo >= 0
          ? html`<button class="btn primary xl" onClick=${function () { start(firstTodo); }}>${prog.done ? "Keep shooting: " + list[firstTodo].beat._id + " is next" : "Start shooting"}</button>`
          : html`<button class="btn primary xl" onClick=${function () { RR.go("cut"); }}>Everything is shot. Open the cut</button>`}
        ${retakes.length ? html`<p class="fix fix-warn">${retakes.length} to shoot again: ${retakes.map(function (s) { return s.beat._id; }).join(", ")}</p>` : null}
        ${open ? html`<button class="notice" onClick=${function () { RR.go("cut"); }}><b>${open} thing${open > 1 ? "s" : ""} to confirm before you record.</b> Numbers and legal lines that need a real source. Tap to see them.</button>` : null}
      </section>

      ${stops.map(function (st, n) { return html`<section class="panel">
        <div class="panel-head"><span class="stop-n">${n + 1}</span><div><h2>${st.name}</h2>${st.tip && html`<p class="dim">${st.tip}</p>`}</div></div>
        ${st.shots.map(function (x) { var b = x.s.beat, cut = x.s.kind === "broll", state = RR.takes(b._id, x.s.kind).length ? (cut ? "good" : RR.beatState(b)) : "todo";
          return html`<button class="shot-row" onClick=${function () { start(x.k); }}>
            <span class="mono id">${b._id}</span>
            <span class="shot-text">${cut ? html`<i>Cutaway:</i> ${b.broll}` : b.say || (b.cues ? html`<i>One take:</i> ${b.cues.length} moves` : html`<i>Text:</i> ${b.screen}`)}</span>
            <span class="mono dim">${cut ? "4s+" : RR.sec(b.say ? RR.sayTime(b.say) : b.seconds || 3)}</span><${ui.Dot} s=${state} /></button>`; })}
      </section>`; })}

      ${r.hooks && r.hooks.length > 1 && html`<details class="panel"><summary>Other ways to open it</summary>${r.hooks.map(function (h) { return html`<p class="alt-hook">“${h.say}” ${h.screen && html`<span class="card sm-card">${h.screen}</span>`}</p>`; })}${r.spanish_hook && html`<p class="alt-hook"><small>Spanish:</small> “${r.spanish_hook}”</p>`}</details>`}
      ${r.setup && r.setup.length ? html`<details class="panel"><summary>Phone settings before you start</summary><ul class="plain">${r.setup.map(function (t) { return html`<li>${t}</li>`; })}</ul></details>` : null}
    </div>`;
  };
})();

</script>
<script>/* ui-cut.js */
/* Reel Room - Cut tab: watch the reel assemble from your takes, choose and trim, review the final. */
(function () {
  "use strict";
  var RR = window.RR, S = RR.S, html = RR.html, ui = RR.ui;

  function sequence() {
    var t = 0;
    return S.beats.map(function (b, i) {
      var c = RR.chosen(b), br = b.use_broll === false ? null : RR.chosen(b, "broll"), len = RR.beatLen(b);
      var it = { beat: b, i: i, clip: c, broll: br, in: c ? c.in || 0 : 0, len: len, start: t };
      t += len; return it;
    });
  }
  function chunks(line) { var w = (line || "").split(/\s+/).filter(Boolean), out = []; for (var i = 0; i < w.length; i += 3) out.push(w.slice(i, i + 3).join(" ")); return out; }
  function captionAt(line, frac) {
    var g = chunks(line); if (!g.length) return "";
    var total = g.reduce(function (n, x) { return n + x.length; }, 0), acc = 0;
    for (var i = 0; i < g.length; i++) { acc += g[i].length / total; if (frac <= acc) return g[i]; }
    return g[g.length - 1];
  }

  /* plays the chosen takes back to back with the text card and captions on top.
     Beats with no take yet play as a slide for as long as the line takes to say. */
  ui.Player = function (p) {
    var seq = p.seq, st = RR.useState({ i: 0, t: 0, playing: false }), pos = st[0], setPos = st[1];
    var chrome = RR.useState(RR.ls.get("chrome", true)), showUi = chrome[0], setShowUi = chrome[1];
    var a = RR.useRef(null), b = RR.useRef(null), br = RR.useRef(null), eng = RR.useRef({ active: 0, i: 0, playing: false, slideT0: 0, raf: 0 });
    var seqRef = RR.useRef(seq); seqRef.current = seq;
    var els = function () { return [a.current, b.current]; };
    function seekTo(el, t) {
      if (el.readyState >= 1) { try { el.currentTime = t; } catch (_) {} return; }
      var f = function () { el.removeEventListener("loadedmetadata", f); try { el.currentTime = t; } catch (_) {} };
      el.addEventListener("loadedmetadata", f);
    }
    function load(el, it) { if (!el) return; if (it && it.clip) { var src = "/_blob/" + it.clip.asset; if (el.dataset.src !== src) { el.dataset.src = src; el.src = src; } seekTo(el, it.in); } }
    function show(i) {
      var e = eng.current, it = seqRef.current[i], cur = els()[e.active], nxt = els()[1 - e.active];
      e.i = i; e.slideT0 = performance.now();
      if (cur) cur.pause();
      if (it && it.clip) { e.active = 1 - e.active; load(nxt, it); nxt.style.opacity = 1; if (cur) cur.style.opacity = 0; if (e.playing) { var pr = nxt.play(); if (pr && pr.catch) pr.catch(function () {}); } }
      else { if (cur) cur.style.opacity = 0; if (nxt) nxt.style.opacity = 0; }
      var v = br.current;
      if (v) { if (it && it.broll) { var s2 = "/_blob/" + it.broll.asset; if (v.dataset.src !== s2) { v.dataset.src = s2; v.src = s2; } seekTo(v, 0); v.style.opacity = 1; if (e.playing) { var p2 = v.play(); if (p2 && p2.catch) p2.catch(function () {}); } } else { v.pause(); v.style.opacity = 0; } }
      var after = seqRef.current[i + 1]; if (after && after.clip) load(els()[1 - e.active], after);
      setPos({ i: i, t: 0, playing: e.playing });
    }
    function stop(reset) { var e = eng.current; e.playing = false; cancelAnimationFrame(e.raf); els().forEach(function (x) { x && x.pause(); }); br.current && br.current.pause(); if (reset) show(0); else setPos(function (s) { return { i: s.i, t: s.t, playing: false }; }); }
    function tick() {
      var e = eng.current, it = seqRef.current[e.i]; if (!e.playing) return;
      if (!it) return stop(true);
      var el = els()[e.active], t = it.clip && el ? Math.max(0, el.currentTime - it.in) : (performance.now() - e.slideT0) / 1000;
      if (t >= it.len || (it.clip && el && el.ended)) { if (e.i + 1 >= seqRef.current.length) return stop(true); show(e.i + 1); }
      else setPos({ i: e.i, t: t, playing: true });
      e.raf = requestAnimationFrame(tick);
    }
    function play() {
      var e = eng.current;
      /* a tap unlocks both players on phones, so the cut between takes does not stall */
      els().concat([br.current]).forEach(function (x) { if (x && x.dataset.src && x.paused) { var pr = x.play(); if (pr && pr.then) pr.then(function () { if (x !== els()[e.active] && x !== br.current) x.pause(); }, function () {}); } });
      e.playing = true; e.slideT0 = performance.now() - pos.t * 1000;
      var it = seqRef.current[e.i], el = els()[e.active];
      if (it && it.clip && el) { var pr = el.play(); if (pr && pr.catch) pr.catch(function () {}); }
      if (it && it.broll && br.current) { var p2 = br.current.play(); if (p2 && p2.catch) p2.catch(function () {}); }
      cancelAnimationFrame(e.raf); e.raf = requestAnimationFrame(tick); setPos({ i: e.i, t: pos.t, playing: true });
    }
    RR.useEffect(function () { show(0); return function () { stop(false); }; }, [p.sig]);
    RR.useEffect(function () { if (p.jump != null && p.jump.i < seq.length) show(p.jump.i); }, [p.jump]);
    var it = seq[pos.i] || {}, beat = it.beat || {}, frac = it.len ? Math.min(1, pos.t / it.len) : 0, total = seq.reduce(function (n, x) { return n + x.len; }, 0), at = (it.start || 0) + pos.t;
    return html`<div class="player">
      <div class="stage">
        <video ref=${a} playsinline preload="auto" class="layer"></video>
        <video ref=${b} playsinline preload="auto" class="layer"></video>
        <video ref=${br} playsinline muted preload="auto" class="layer"></video>
        ${!it.clip && html`<div class="slide"><span class="mono">${beat._id}</span><p>${beat.say || beat.shot || beat.broll}</p><small>Not shot yet. Timed from the script.</small></div>`}
        ${beat.cues ? beat.cues.filter(function (c) { return pos.t >= c.at && pos.t < c.end; }).map(function (c) { return html`<div class=${RR.cls("ov-cue", "pos-" + c.pos, c === beat.cues[0] && "card-hook")}>${c.text}</div>`; })
          : beat.screen && html`<div class=${RR.cls("ov-card", pos.i === 0 && "card-hook")}>${beat.screen}</div>`}
        ${beat.say && html`<div class="ov-cap">${captionAt(beat.say, frac)}</div>`}
        ${showUi && html`<div class="ov-ui" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b><b></b></div>`}
        <button class=${RR.cls("play", pos.playing && "is-playing")} aria-label=${pos.playing ? "Pause" : "Play"} onClick=${function () { pos.playing ? stop(false) : play(); }}>${pos.playing ? "" : "▶"}</button>
      </div>
      <div class="transport"><span class="mono">${RR.tc(at)} / ${RR.tc(total)}</span>
        <label class="switch"><input type="checkbox" id="chrome-toggle" checked=${showUi} onChange=${function (e) { setShowUi(e.target.checked); RR.ls.set("chrome", e.target.checked); }} />Show where Instagram covers the frame</label></div>
      <div class="timeline" role="list">${seq.map(function (x) { var state = x.clip ? RR.beatState(x.beat) : "todo";
        return html`<button role="listitem" class=${RR.cls("tl", "tl-" + state, x.i === pos.i && "tl-on", x.len > 4.5 && "tl-long")} style=${"flex:" + Math.max(0.6, x.len) + " 1 0"} title=${x.beat._id + " " + RR.sec(x.len)} onClick=${function () { show(x.i); p.onSelect && p.onSelect(x.beat._id); }}>
          ${x.i === pos.i && html`<i style=${"width:" + Math.round(frac * 100) + "%"}></i>`}<span>${x.beat._id.replace("b", "")}</span></button>`; })}</div>
    </div>`;
  };

  /* choose the take, set where it starts and ends, change the words */
  ui.Wave = function (p) {
    var c = p.clip, pk = c.peaks || [], d = c.dur || 1, a = (p.in / d) * 100, b = (p.out / d) * 100;
    return html`<div class="wave"><div class="wave-bars">${pk.length ? pk.map(function (v) { return html`<i style=${"height:" + Math.max(4, v) + "%"}></i>`; }) : html`<span class="dim">No waveform for this clip</span>`}</div>
      <div class="wave-cut" style=${"left:0;width:" + a + "%"}></div><div class="wave-cut" style=${"left:" + b + "%;right:0"}></div></div>`;
  };
  ui.BeatEditor = function (p) {
    var b = S.beats.filter(function (x) { return x._id === p.id; })[0] || { _id: p.id, gone: true };
    var takes = RR.takes(b._id), cuts = RR.takes(b._id, "broll"), c = RR.chosen(b), cb = RR.chosen(b, "broll");
    var tr = RR.useState(null), trim = tr[0], setTrim = tr[1], sc = RR.useState(b.screen || ""), screen = sc[0], setScreen = sc[1];
    RR.useEffect(function () { setTrim(c ? { in: c.in || 0, out: c.out != null ? c.out : c.dur } : null); }, [c && c._id, c && c.in, c && c.out]);
    RR.useEffect(function () { setScreen(b.screen || ""); }, [b._id, b.screen]);
    var vid = RR.useRef(null);
    var seek = function (t) { if (vid.current) { try { vid.current.currentTime = t; } catch (_) {} } };
    var saveTrim = function () { if (c && trim) RR.act.clip(c._id, { in: +trim.in.toFixed(2), out: +trim.out.toFixed(2), trimmed_by: "nick" }); };
    var audition = function () { var v = vid.current; if (!v || !trim) return; v.currentTime = trim.in; v.play(); var stopAt = function () { if (v.currentTime >= trim.out) { v.pause(); v.removeEventListener("timeupdate", stopAt); } }; v.addEventListener("timeupdate", stopAt); };
    var changed = c && trim && (Math.abs(trim.in - (c.in || 0)) > 0.01 || Math.abs(trim.out - (c.out != null ? c.out : c.dur)) > 0.01);
    var first = S.beats[0] && S.beats[0]._id === b._id;
    if (b.gone) return null;
    return html`<section class="panel editor" id=${"edit-" + b._id}>
      <div class="panel-head"><span class="mono id">${b._id}</span><div class="grow"><p class="ed-line">${b.say ? "“" + b.say + "”" : "No talking: " + (b.shot || "")}</p></div>
        <button class="btn sm ghost" onClick=${function () { RR.set({ sheet: { type: "rewrite", beat: b._id } }); }}>Change line</button></div>
      ${!takes.length && html`<div class="empty sm"><p>No take for this line yet.</p><${ui.Record} beat=${b} kind="aroll" label="Record this line" /></div>`}
      ${c && trim && html`<div class="trim">
        <video ref=${vid} class="trim-video" controls playsinline preload="metadata" src=${"/_blob/" + c.asset + "#t=" + (c.in || 0).toFixed(2)}></video>
        <${ui.Wave} clip=${c} in=${trim.in} out=${trim.out} />
        <label class="range"><span>Start <b class="mono">${RR.sec(trim.in)}</b></span><input type="range" id=${"in-" + b._id} min="0" max=${c.dur} step="0.05" value=${trim.in} onInput=${function (e) { var v = Math.min(+e.target.value, trim.out - 0.3); setTrim({ in: v, out: trim.out }); seek(v); }} /></label>
        <label class="range"><span>End <b class="mono">${RR.sec(trim.out)}</b></span><input type="range" id=${"out-" + b._id} min="0" max=${c.dur} step="0.05" value=${trim.out} onInput=${function (e) { var v = Math.max(+e.target.value, trim.in + 0.3); setTrim({ in: trim.in, out: v }); seek(v); }} /></label>
        <div class="row"><span class="mono">${RR.sec(trim.out - trim.in)} in the cut${trim.out - trim.in > 4.5 ? " · long, add a cutaway or tighten" : ""}</span>
          <button class="btn sm" onClick=${audition}>Play the trim</button><button class="btn sm primary" disabled=${!changed} onClick=${saveTrim}>Save trim</button></div>
        <${ui.Checks} clip=${c} />
        ${S.cap.sample && !c.ai && !S.jobs["review" + c._id] && html`<button class="btn sm" onClick=${function () { RR.job("review" + c._id, "Pulling frames"); RR.framesOf(c).then(function (f) { if (f.length) RR.reviewTake(S.viewId, c._id, b, "aroll", f, c.checks || []); else { RR.job("review" + c._id, null); RR.toast("Could not read frames from that clip.", "bad"); } }); }}>Have Claude look at this take</button>`}
      </div>`}
      ${takes.length > 1 && html`<div class="take-strip"><small>${takes.length} takes</small>${takes.map(function (t, n) { return html`<button class=${RR.cls("take-pill", c && c._id === t._id && "on", "v-" + RR.verdict(t))} onClick=${function () { RR.act.beat(b._id, { take: t._id }); }}>Take ${n + 1} · ${RR.sec(RR.clipLen(t))}</button>`; })}</div>`}
      ${takes.length ? html`<div class="row"><${ui.Record} beat=${b} kind="aroll" label="Record another take" />${c && S.cap.assets && html`<button class="btn sm ghost" onClick=${function () { RR.act.removeClip(c); }}>Delete this take</button>`}</div>` : null}
      <label class="field"><span>Text on screen ${first ? "(the hook card)" : ""}</span>
        <div class="row"><input type="text" id=${"screen-" + b._id} value=${screen} maxlength="160" placeholder="No text on this beat" onInput=${function (e) { setScreen(e.target.value); }} />
        <button class="btn sm" disabled=${screen.trim() === (b.screen || "")} onClick=${function () { RR.act.beat(b._id, { screen: screen.trim() ? screen.trim().toUpperCase() : null }); }}>Save</button></div>
        ${RR.words(screen) > 6 && screen.indexOf("\n") < 0 && html`<small class="fix fix-warn">Over six words. It will not be read in time.</small>`}</label>
      ${b.broll && html`<div class="cutaway"><small>Cutaway</small><p>${b.broll}</p>
        ${cb ? html`<video class="trim-video" controls playsinline muted preload="metadata" src=${"/_blob/" + cb.asset}></video>
          <label class="switch"><input type="checkbox" id=${"use-" + b._id} checked=${b.use_broll !== false} onChange=${function (e) { RR.act.beat(b._id, { use_broll: e.target.checked }); }} />Show the cutaway over this line</label>` : null}
        <${ui.Record} beat=${b} kind="broll" label=${cuts.length ? "Record it again" : "Record cutaway"} /></div>`}
      <${ui.BeatNotes} beat=${b._id} />
    </section>`;
  };
  ui.Msg = function (p) { var n = p.n; return html`<div class=${"msg msg-" + (n.from === "claude" ? "claude" : "nick")}><small>${n.from === "claude" ? "Claude (editor)" : "You"}${n.beat ? " · " + n.beat : ""} · ${RR.when(n.at)}</small>${n.text}</div>`; };
  ui.BeatNotes = function (p) {
    var st = RR.useState(""), v = st[0], set = st[1], mine = S.notes.filter(function (n) { return n.beat === p.beat; });
    return html`<div class="notes">${mine.map(function (n) { return html`<${ui.Msg} n=${n} />`; })}
      <div class="row"><input type="text" id=${"note-" + p.beat} value=${v} placeholder="Note for the edit on this beat" onInput=${function (e) { set(e.target.value); }} /><button class="btn sm" disabled=${!v.trim()} onClick=${function () { RR.act.note(v, p.beat); set(""); }}>Send</button></div></div>`;
  };

  ui.Cut = function () {
    var r = RR.reel(), sel = RR.useState(null), selId = sel[0], setSel = sel[1], jm = RR.useState(null), jump = jm[0], setJump = jm[1], nt = RR.useState(""), note = nt[0], setNote = nt[1], cp = RR.useState("Copy caption"), copyLabel = cp[0], setCopy = cp[1];
    if (!r) return html`<div class="empty">Nothing to cut yet. Start from Today or Ideas.</div>`;
    var seq = sequence(), total = RR.total(), target = r.target_seconds || 30, shot = seq.filter(function (x) { return x.clip; }).length;
    var sig = S.viewId + "|" + seq.map(function (x) { return (x.clip ? x.clip._id + ":" + x.in + ":" + x.len.toFixed(2) : "-") + (x.broll ? "+" + x.broll._id : ""); }).join(",");
    var long = seq.filter(function (x) { return x.len > 4.5 && !x.broll; }), holes = /\{\{/.test(S.beats.map(function (b) { return (b.say || "") + (b.screen || ""); }).join(" "));
    var ready = r.status === "ready_to_edit", open = (r.verify || []).filter(function (v) { return !v.done; }).length;
    var copy = function () { try { navigator.clipboard.writeText(r.caption).then(function () { setCopy("Copied"); setTimeout(function () { setCopy("Copy caption"); }, 1500); }, function () { setCopy("Press and hold the text to copy"); }); } catch (_) { setCopy("Press and hold the text to copy"); } };
    return html`<div class="stack">
      <section class="panel flush">
        <${ui.Player} seq=${seq} sig=${sig} jump=${jump} onSelect=${setSel} />
        <div class="cut-facts">
          <span class=${Math.abs(total - target) > 6 ? "bad" : ""}><b class="mono">${RR.sec(total)}</b> long, target ${target}s</span>
          <span><b class="mono">${shot}/${seq.length}</b> lines shot</span>
          ${long.length ? html`<span class="bad">${long.map(function (x) { return x.beat._id; }).join(", ")} run past 4.5s on one shot</span>` : null}
          ${holes ? html`<span class="bad">A {{placeholder}} is still in the script</span>` : null}
        </div>
        <p class="dim pad">This is a preview built in your browser from the takes you picked. Tap a block to work on that beat. The finished file, with burned-in text and levelled audio, is rendered by Claude.</p>
      </section>

      ${r.final && r.final.asset ? html`<section class="panel"><h2>Finished cut from Claude</h2>
        <video class="final" controls playsinline preload="metadata" src=${"/_blob/" + r.final.asset}></video>
        ${r.final.note && html`<p>${r.final.note}</p>`}
        ${r.qc && r.qc.verdict && html`<p class="slate-chip">Check: ${r.qc.verdict}</p>`}
        ${(r.qc && r.qc.flags || []).map(function (f) { return html`<p class="fix fix-warn">${f}</p>`; })}
        <div class="row"><button class="btn primary grow" onClick=${function () { RR.act.status("approved"); }}>${r.status === "approved" || r.status === "posted" ? "Approved" : "Approve this cut"}</button>
          <button class="btn" onClick=${function () { RR.act.status("changes"); var el = document.getElementById("note-all"); if (el) el.focus(); }}>Ask for changes</button></div>
      </section>` : html`<section class="panel"><h2>Send it to be finished</h2>
        <p class="dim">${ready ? "Marked ready. Claude renders it on the next check: every morning, or sooner if you say so in the chat." : "When the preview above looks right, hand it over. Your take choices, trims and text go with it."}</p>
        <button class=${RR.cls("btn xl", !ready && "primary")} disabled=${!shot} onClick=${function () { RR.act.status(ready ? "shooting" : "ready_to_edit"); }}>${ready ? "Take it back, I'm still working" : "Ready for the final render"}</button></section>`}

      ${selId ? html`<${ui.BeatEditor} id=${selId} />` : null}
      <section class="panel"><h2>Every beat</h2>${seq.map(function (x) { var state = x.clip ? RR.beatState(x.beat) : "todo";
        return html`<button class=${RR.cls("shot-row", selId === x.beat._id && "row-on")} onClick=${function () { setSel(x.beat._id); setJump({ i: x.i, n: Date.now() }); setTimeout(function () { var el = document.getElementById("edit-" + x.beat._id); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); }}>
          <span class="mono id">${x.beat._id}</span><span class="shot-text">${x.beat.say || x.beat.screen || x.beat.broll}</span>
          <span class="mono dim">${RR.sec(x.len)}${RR.takes(x.beat._id).length > 1 ? " · " + RR.takes(x.beat._id).length + " takes" : ""}</span><${ui.Dot} s=${state} /></button>`; })}</section>

      ${r.verify && r.verify.length ? html`<section class="panel"><h2>Confirm before it goes out${open ? " · " + open + " open" : ""}</h2>${r.verify.map(function (v, i) { return html`<label class="check"><input type="checkbox" id=${"verify-" + i} checked=${!!v.done} onChange=${function () { RR.act.verify(i); }} /><span>${v.item}<small>${v.from}</small></span></label>`; })}</section>` : null}
      ${r.caption && html`<section class="panel"><h2>Caption</h2><pre class="caption">${r.caption}</pre><button class="btn" onClick=${copy}>${copyLabel}</button></section>`}
      <section class="panel"><h2>Notes with your editor</h2>
        <p class="dim">These go to Claude in the chat session, which does the final render. It reads them on its next check.</p>
        ${S.notes.filter(function (n) { return !n.beat; }).map(function (n) { return html`<${ui.Msg} n=${n} />`; })}
        <textarea id="note-all" value=${note} placeholder="What to change in the edit: pace, order, a card, the ending" onInput=${function (e) { setNote(e.target.value); }}></textarea>
        <button class="btn primary" disabled=${!note.trim()} onClick=${function () { RR.act.note(note); setNote(""); }}>Send note</button></section>
    </div>`;
  };
})();

</script>
<script>/* ui-more.js */
/* Reel Room - Ideas, Board, the Ask sheet, and the app shell. */
(function () {
  "use strict";
  var RR = window.RR, S = RR.S, html = RR.html, ui = RR.ui;

  /* ---------- Ideas ---------- */
  function writeScript(idea) {
    if (S.jobs.script) return;
    RR.job("script", "Writing the script");
    RR.genScript(idea, function (x) { RR.job("script", "Writing the script · " + RR.words(x.text) + " words"); }).then(function (out) {
      return RR.act.createReel(out.reel, out.beats).then(function () {
        if (idea._id) RR.act.idea(idea._id, { status: "scripted", reel: out.reel._id });
        RR.job("script", null); RR.toast("Script is ready. Read it through before you shoot.", "good"); RR.go("today");
      });
    }, function (e) { RR.job("script", null); RR.toast(RR.aiError(e), "bad"); });
  }
  var KIND = { talk: "Talk", point: "No talking · point", text: "No talking · one clip" };
  ui.BankDetail = function (p) {
    var v = p.v, b = v.beats;
    if (v.kind === "talk") return html`<ol class="plain bank-lines">${b.map(function (x) { return html`<li>${x.say}${x.screen ? html` <span class="card sm-card">${x.screen}</span>` : null}</li>`; })}</ol>`;
    var c = b[0].cues || [], st = v.setup || {};
    return html`<div class="bank-lines">${st.where && html`<p><b>Where:</b> ${st.where}</p>`}${st.clip && html`<p><b>The clip:</b> ${st.clip}</p>`}
      <ol class="cues compact">${c.map(function (q) { return html`<li><span class="mono cue-t">${q.at.toFixed(1)}s</span><div class="cue-body"><span class="card sm-card">${q.text}</span><p>${q.do}</p></div></li>`; })}</ol></div>`;
  };
  ui.Bank = function (p) {
    var st = RR.useState(RR.ls.get("bankFilter", "point")), f = st[0], setF = st[1], mr = RR.useState(p.top ? 4 : 8), more = mr[0], setMore = mr[1];
    var op = RR.useState(null), open = op[0], setOpen = op[1], hd = RR.useState(RR.ls.get("bankHidden", false)), hidden = hd[0], setHidden = hd[1];
    if (!S.bank.length) return p.top ? html`<div class="empty sm">Loading the video list\u2026</div>` : null;
    var done = {}; S.reels.forEach(function (r) { if (r.bank_id) done[r.bank_id] = r; });
    var list = S.bank.filter(function (v) { return f === "all" || v.kind === f; });
    var chip = function (k, label) { return html`<button class=${RR.cls("take-pill", f === k && "on")} onClick=${function () { setF(k); setMore(8); RR.ls.set("bankFilter", k); }}>${label} · ${k === "all" ? S.bank.length : S.bank.filter(function (v) { return v.kind === k; }).length}</button>`; };
    if (p.top && hidden) return html`<button class="btn" onClick=${function () { setHidden(false); RR.ls.set("bankHidden", false); }}>Show the ${S.bank.length} videos ready to shoot</button>`;
    return html`<section class="stack tight bank"><div class="row"><h2 class="sec grow">${S.bank.length} videos ready to shoot</h2>
        ${p.top && html`<button class="btn sm ghost" onClick=${function () { setHidden(true); RR.ls.set("bankHidden", true); }}>Hide</button>`}</div>
      <p class="dim">Each one answers a question people search about buying or selling in Baltimore. Open one to see every shot, then tap Shoot this.</p>
      <div class="take-strip">${chip("point", "No talking: point at text")}${chip("text", "No talking: one clip")}${chip("talk", "Talk to camera")}${chip("all", "All")}</div>
      ${list.slice(0, more).map(function (v) { var r = done[v.id], hook = (v.beats[0] && (v.beats[0].say || v.beats[0].screen.split("\n")[0])) || "";
        return html`<article class="idea">
          <div class="idea-top"><span class="slate-chip">${KIND[v.kind]}</span><span class="mono dim">${v.kind === "talk" ? v.beats.length + " lines" : "one take"} · ${v.seconds}s</span></div>
          <h3>${v.title}</h3><p class="idea-hook">“${hook}”</p><p class="dim">Answers: ${v.question}${v.verify && v.verify.length ? " · " + v.verify.length + " to confirm first" : ""}</p>
          ${open === v.id && html`<${ui.BankDetail} v=${v} />`}
          <div class="row wrap">${r ? html`<button class="btn sm" onClick=${function () { RR.view(r._id); RR.go("today"); window.scrollTo(0, 0); }}>Open · ${RR.STAGE_LABEL[r.status] || r.status}</button>`
            : html`<button class="btn primary sm" onClick=${function () { RR.act.fromBank(v).then(function () { RR.go("today"); RR.toast("On the slate. Tap Start shooting.", "good"); var el = document.querySelector(".slate-head"); if (el) el.scrollIntoView({ behavior: "smooth" }); }); }}>Shoot this</button>`}
            <button class="btn sm ghost" onClick=${function () { setOpen(open === v.id ? null : v.id); }}>${open === v.id ? "Hide the shots" : "See every shot"}</button></div></article>`; })}
      ${list.length > more && html`<button class="btn" onClick=${function () { setMore(more + 12); }}>Show more (${list.length - more} left)</button>`}
    </section>`;
  };
  ui.Research = function () {
    var r = S.research; if (!r) return null;
    var max = Math.max.apply(null, (r.shapes || []).map(function (s) { return s.rate; }).concat([r.base, 1]));
    return html`<section class="panel"><h2>What is working right now</h2>
      <p class="dim">${r.n.toLocaleString()} short videos from ${r.accounts} real estate accounts, each measured against that account's own typical video. ${r.base}% beat it by three times or more. ${r.caveat || ""}</p>
      <div class="bars">${(r.shapes || []).map(function (s) { return html`<div class="bar-row"><span class="bar-name">${s.name}</span>
        <div class="bar-track"><i class=${s.rate >= r.base ? "up" : "down"} style=${"width:" + Math.round(100 * s.rate / max) + "%"}></i><em style=${"left:" + Math.round(100 * r.base / max) + "%"}></em></div>
        <span class="mono">${s.rate}%</span></div>`; })}
        <p class="bar-key"><em></em>the line is the ${r.base}% average</p></div>
      ${(r.patterns || []).map(function (p) { return html`<div class="pattern"><b>${p.title}</b><p>${p.detail}</p></div>`; })}
      ${r.outliers && r.outliers.length ? html`<details><summary>The videos behind this</summary><ul class="outliers">${r.outliers.map(function (o) { return html`<li><b class="mono">${o.x}×</b><span>${o.title}<small>${o.account} · ${Number(o.views).toLocaleString()} views</small></span></li>`; })}</ul></details>` : null}
      <small class="dim">Updated ${r.updated || ""}</small></section>`;
  };
  ui.Ideas = function () {
    var st = RR.useState(""), seed = st[0], setSeed = st[1], sg = RR.useState({ loading: false, list: [], err: "" }), sug = sg[0], setSug = sg[1];
    var gen = function () { setSug({ loading: true, list: [], err: "" }); RR.genIdeas(seed).then(function (l) { setSug({ loading: false, list: l, err: l.length ? "" : "Nothing came back. Try again." }); }, function (e) { setSug({ loading: false, list: [], err: RR.aiError(e) }); }); };
    var queue = S.ideas.filter(function (i) { return i.status !== "done" && i.status !== "scripted"; }).sort(function (a, b) { return (b.status === "next") - (a.status === "next") || (b.from === "nick") - (a.from === "nick") || (a.n || 0) - (b.n || 0); });
    var ai = !!S.cap.sample, busy = !!S.jobs.script;
    var card = function (i, fresh) { return html`<article class="idea">
      <div class="idea-top"><span class="slate-chip">${i.formula || (i.from === "nick" ? "Yours" : "Idea")}</span>${i.status === "next" && html`<span class="state state-good">Up next</span>`}</div>
      <h3>${i.topic}</h3>${i.hook && html`<p class="idea-hook">“${i.hook}”</p>`}${i.evidence && html`<p class="dim">${i.evidence}</p>`}
      <div class="row wrap">
        ${ai && html`<button class="btn primary sm" disabled=${busy} onClick=${function () { writeScript(i); }}>Write the script</button>`}
        ${fresh ? html`<button class="btn sm" onClick=${function () { RR.act.addIdea({ topic: i.topic, formula: i.formula || "", hook: i.hook || "", evidence: i.evidence || "", from: "claude" }); setSug({ loading: false, err: "", list: sug.list.filter(function (x) { return x !== i; }) }); }}>Save for later</button>`
          : html`<button class="btn sm" onClick=${function () { RR.act.nextIdea(i); }}>${i.status === "next" ? "Not next" : "Make it tomorrow's"}</button><button class="btn sm ghost" onClick=${function () { RR.act.removeIdea(i._id); }}>Remove</button>`}
      </div></article>`; };
    return html`<div class="stack">
      <${ui.Bank} />
      <section class="panel"><h2>Start from something real</h2>
        <textarea id="idea-seed" value=${seed} placeholder="A question a buyer asked this week. A listing you just took. Something on your block that annoyed you." onInput=${function (e) { setSeed(e.target.value); }}></textarea>
        <div class="row wrap">
          ${ai && html`<button class="btn primary" disabled=${sug.loading} onClick=${gen}>${sug.loading ? html`<span class="spin"></span>Thinking` : seed.trim() ? "Turn it into reel ideas" : "Give me four ideas"}</button>`}
          <button class="btn" disabled=${!seed.trim()} onClick=${function () { RR.act.addIdea({ topic: seed.trim().slice(0, 300) }); setSeed(""); }}>Save as my own idea</button></div>
        ${!ai && html`<p class="dim">Instant ideas and scripts need Claude allowed for this page. Your saved ideas still reach Claude in chat each morning.</p>`}
        ${sug.err && html`<p class="fix fix-bad">${sug.err}</p>`}
        ${busy && html`<p class="thinking"><span class="spin"></span>${S.jobs.script}. This takes about a minute.</p>`}
      </section>
      ${sug.list.length ? html`<section class="stack tight"><h2 class="sec">Fresh ideas</h2>${sug.list.map(function (i) { return card(i, true); })}</section>` : null}
      <section class="stack tight"><h2 class="sec">Queue · ${queue.length}</h2>
        ${queue.length ? queue.map(function (i) { return card(i, false); }) : html`<div class="empty sm">Nothing queued. Add an idea above.</div>`}</section>
      <${ui.Research} />
    </div>`;
  };

  /* ---------- Board ---------- */
  ui.Results = function (p) {
    var r = p.reel, st = RR.useState(Object.assign({ views: "", sends: "", saves: "", comments: "", leads: "" }, r.results || {})), v = st[0], set = st[1];
    var f = function (k, label) { return html`<label class="num"><span>${label}</span><input type="number" inputmode="numeric" min="0" id=${"res-" + r._id + k} value=${v[k]} onInput=${function (e) { var n = Object.assign({}, v); n[k] = e.target.value; set(n); }} /></label>`; };
    return html`<div class="results"><div class="num-grid">${f("views", "Views")}${f("sends", "Sends")}${f("saves", "Saves")}${f("comments", "Comments")}${f("leads", "Leads")}</div>
      <button class="btn sm primary" onClick=${function () { var out = {}; Object.keys(v).forEach(function (k) { out[k] = v[k] === "" ? null : +v[k]; }); out.at = Date.now(); RR.act.results(r._id, out).then(function () { RR.toast("Saved. Tomorrow's pick will weigh it.", "good"); }); }}>Save results</button></div>`;
  };
  ui.Board = function () {
    var op = RR.useState(null), openId = op[0], setOpen = op[1], vo = S.voice || {}, sv = RR.useState(null), draft = sv[0], setDraft = sv[1];
    var d = draft || { samples: vo.samples || "", never: vo.never || "" };
    var au = RR.useState(RR.ls.get("autoReview", true)), auto = au[0], setAuto = au[1];
    var posted = S.reels.filter(function (r) { return r.results && r.results.views != null; }).slice().reverse();
    var vals = posted.map(function (r) { return r.results.views; }).sort(function (a, b) { return a - b; }), median = vals.length ? vals[Math.floor((vals.length - 1) / 2)] : 0, top = Math.max.apply(null, vals.concat([1]));
    var u = S.usage;
    return html`<div class="stack">
      <section class="panel"><h2>Scoreboard</h2>
        ${posted.length ? html`<div class="bars">${posted.map(function (r) { var x = median ? r.results.views / median : 0;
            return html`<div class="bar-row"><span class="bar-name">${r.title}</span><div class="bar-track"><i class=${x >= 1 ? "up" : "down"} style=${"width:" + Math.max(2, Math.round(100 * r.results.views / top)) + "%"}></i><em style=${"left:" + Math.round(100 * median / top) + "%"}></em></div><span class="mono">${Number(r.results.views).toLocaleString()}</span></div>`; })}
            <p class="bar-key"><em></em>your median, ${median.toLocaleString()} views${posted.length < 5 ? ". Too few reels to call a pattern yet." : ""}</p></div>`
          : html`<div class="empty sm">Post a reel and put its numbers in below. This fills in as a chart of each reel against your own median, which is the only comparison that tells you what to make more of.</div>`}
      </section>
      <section class="panel"><h2>Every reel</h2>
        ${S.reels.length ? S.reels.map(function (r) { var isOpen = openId === r._id;
          return html`<div class=${RR.cls("reel-row", r._id === S.currentId && "reel-current")}>
            <button class="reel-main" onClick=${function () { setOpen(isOpen ? null : r._id); }}>
              <span class="mono dim">${r._id}</span><b>${r.title}</b>
              <span class="row"><span class=${"stage-chip st-" + r.status}>${RR.STAGE_LABEL[r.status] || r.status}</span>${r._id === S.currentId && html`<span class="tag-on">On the slate</span>`}${r.results && r.results.views != null && html`<span class="mono dim">${Number(r.results.views).toLocaleString()} views</span>`}</span></button>
            ${isOpen && html`<div class="reel-open"><div class="row wrap">
                <button class="btn sm" onClick=${function () { RR.view(r._id); RR.go("today"); }}>Open</button>
                ${r._id !== S.currentId && html`<button class="btn sm" onClick=${function () { RR.act.makeCurrent(r._id); RR.go("today"); }}>Put on today's slate</button>`}</div>
              <p class="dim">After it has been up 48 hours, enter what Instagram shows under Insights.</p><${ui.Results} reel=${r} /></div>`}
          </div>`; }) : html`<div class="empty sm">No reels yet.</div>`}
      </section>
      <section class="panel"><h2>Your voice</h2>
        <p class="dim">Every script and rewrite is written to sound like this. Paste three captions or reels of yours, word for word.</p>
        <label class="field"><span>How I actually talk</span><textarea id="voice-samples" value=${d.samples} placeholder="Paste your own captions or what you said in a reel that sounded most like you." onInput=${function (e) { setDraft({ samples: e.target.value, never: d.never }); }}></textarea></label>
        <label class="field"><span>Words and topics I never use</span><input type="text" id="voice-never" value=${d.never} placeholder="dream home, nestled, hustle…" onInput=${function (e) { setDraft({ samples: d.samples, never: e.target.value }); }} /></label>
        <button class="btn primary" disabled=${!draft} onClick=${function () { RR.act.voice({ samples: d.samples.slice(0, 6000), never: d.never.slice(0, 500) }).then(function () { setDraft(null); RR.toast("Voice saved.", "good"); }); }}>Save my voice</button>
      </section>
      <section class="panel"><h2>Set-up</h2>
        <label class="switch"><input type="checkbox" id="auto-review" checked=${auto} onChange=${function (e) { setAuto(e.target.checked); RR.ls.set("autoReview", e.target.checked); }} />Have Claude look at every take as soon as it uploads</label>
        ${u && html`<div class="meter"><div class="meter-bar"><i style=${"width:" + Math.min(100, Math.round(100 * u.bytes / (u.maxBytes || 1))) + "%"}></i></div><span class="mono">${RR.mb(u.bytes)} of ${RR.mb(u.maxBytes)} used</span></div>`}
        <p class="dim">Clips are capped at 20 MB each. Finished reels are cleared from here by Claude after you approve them.</p>
      </section>
    </div>`;
  };

  /* ---------- Ask ---------- */
  var chat = { turns: [], ctl: null };
  ui.Ask = function (p) {
    var st = RR.useState({ text: "", live: "", busy: false, err: "", n: 0 }), s = st[0], set = st[1], end = RR.useRef(null);
    RR.useEffect(function () { if (end.current) end.current.scrollIntoView({ block: "end" }); }, [s.live, s.n]);
    var send = function (q) {
      q = (q || s.text).trim(); if (!q || s.busy) return;
      chat.turns.push({ role: "user", content: q }); chat.ctl = new AbortController();
      set({ text: "", live: "", busy: true, err: "", n: s.n + 1 });
      RR.ask(chat.turns.slice(-12), function (x) { set(function (o) { return Object.assign({}, o, { live: x.text }); }); }, chat.ctl.signal).then(function (r) {
        chat.turns.push({ role: "assistant", content: r.text }); set(function (o) { return { text: o.text, live: "", busy: false, err: "", n: o.n + 1 }; });
      }, function (e) { if (e && e.text) chat.turns.push({ role: "assistant", content: e.text }); else chat.turns.pop(); set(function (o) { return { text: o.text || q, live: "", busy: false, err: e && e.code === "cancelled" ? "" : RR.aiError(e), n: o.n + 1 }; }); });
    };
    var starters = ["It started raining. What do I change?", "Give me a stronger last line.", "Is this too long? What would you cut?", "Write the Spanish version of line one."];
    return html`<${ui.Sheet} title="Ask Claude" onClose=${p.onClose}>
      <p class="dim">Answers on the spot, knowing today's script and what is working. It cannot see your clips from here.</p>
      <div class="chat">
        ${!chat.turns.length && !s.busy && html`<div class="starters">${starters.map(function (q) { return html`<button class="option" onClick=${function () { send(q); }}>${q}</button>`; })}</div>`}
        ${chat.turns.map(function (t) { return html`<div class=${"msg msg-" + (t.role === "user" ? "nick" : "claude")}>${t.content}</div>`; })}
        ${s.busy && html`<div class="msg msg-claude">${s.live || html`<span class="thinking"><span class="spin"></span>Thinking</span>`}</div>`}
        ${s.err && html`<p class="fix fix-bad">${s.err}</p>`}<div ref=${end}></div>
      </div>
      <div class="row ask-row"><input type="text" id="ask-input" value=${s.text} placeholder="Ask about this reel" onInput=${function (e) { set(Object.assign({}, s, { text: e.target.value })); }} onKeyDown=${function (e) { if (e.key === "Enter") send(); }} />
        ${s.busy ? html`<button class="btn" onClick=${function () { chat.ctl && chat.ctl.abort(); }}>Stop</button>` : html`<button class="btn primary" disabled=${!s.text.trim()} onClick=${function () { send(); }}>Ask</button>`}</div>
    <//>`;
  };

  /* ---------- shell ---------- */
  var TABS = [["today", "Today"], ["cut", "Cut"], ["ideas", "Ideas"], ["board", "Board"]];
  ui.App = function () {
    RR.useStore();
    var r = RR.reel(), sheet = S.sheet, close = function () { RR.set({ sheet: null }); };
    var View = { today: ui.Today, cut: ui.Cut, ideas: ui.Ideas, board: ui.Board }[S.tab];
    var rb = sheet && sheet.type === "rewrite" ? S.beats.filter(function (b) { return b._id === sheet.beat; })[0] : null;
    return html`<div class="app">
      <header class="top"><div class="stripe" aria-hidden="true"></div>
        <div class="top-row"><div class="brand"><b>REEL ROOM</b><span class="mono dim">v6 \u00B7 ${S.bank.length} videos</span></div>
          ${S.cap.sample && html`<button class="btn sm ask-btn" onClick=${function () { RR.set({ sheet: { type: "ask" } }); }}>Ask Claude</button>`}</div>
      </header>
      <main class="wrap"><${View} /></main>
      <nav class="tabbar" aria-label="Sections">${TABS.map(function (t) { return html`<a href=${"#" + t[0]} aria-current=${S.tab === t[0] ? "page" : null}>${t[1]}</a>`; })}</nav>
      ${S.shoot && html`<${ui.ShootMode} />`}
      ${S.practice && html`<${ui.Practice} />`}
      ${rb && html`<${ui.Rewrite} beat=${rb} onClose=${close} />`}
      ${sheet && sheet.type === "ask" && html`<${ui.Ask} onClose=${close} />`}
      <div class="toasts" aria-live="polite">${S.toasts.map(function (t) { return html`<div class=${"toast toast-" + t.kind}>${t.text}</div>`; })}</div>
    </div>`;
  };

  var root = document.getElementById("app");
  root.textContent = "";
  RR.render(html`<${ui.App} />`, root);
  var use = window.claude && window.claude.use;
  if (!use) RR.set({ booted: true, failed: "signed_out" });
  else Promise.all(["db", "assets", "sample"].map(function (n) { return window.claude.use(n).catch(function () { return null; }); }))
    .then(function (c) { RR.boot({ db: c[0], assets: c[1], sample: c[2] }); });
})();

</script>
